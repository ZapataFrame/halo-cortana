<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de movimientos de Cortana</title><style>
body{margin:0;background:#111;color:#eee;font:15px system-ui}main{display:grid;grid-template-columns:minmax(0,1fr) 260px;height:100dvh}#surface{background:#000;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%}aside{padding:20px;overflow:auto}label{display:grid;gap:8px;margin:18px 0}button,select,input{font:inherit;max-width:100%}button{margin:4px;padding:8px}select{padding:8px}a{color:#9ff}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:65dvh auto}}
</style><main><div id="surface" aria-label="Avatar de Cortana"></div><aside><h1>Movimientos</h1><p>Herramienta local de revisión. No utiliza voz ni proveedores.</p><label>Movimiento<select id="motion"></select></label><button id="pause">Pausar</button><label>Tiempo<input id="time" type="number" min="0" max="6" step="0.01" value="0"></label><output id="position">0 s</output><label>Vista<select id="view"><option value="0">Frente</option><option value="90">Perfil izquierdo</option><option value="-90">Perfil derecho</option><option value="180">Espalda</option></select></label><p id="status" role="status">Cargando…</p><a href="/control">Abrir control</a></aside></main><script type="module" src="/tools/motion-preview.js"></script></html>
